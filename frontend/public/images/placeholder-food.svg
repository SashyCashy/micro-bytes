<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="ph-title">
  <title id="ph-title">No image available</title>
  <defs>
    <linearGradient id="ph-warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAA18"/>
      <stop offset="1" stop-color="#F02E35"/>
    </linearGradient>
  </defs>

  <rect width="320" height="240" fill="url(#ph-warm)" fill-opacity="0.10"/>

  <!-- plate -->
  <circle cx="160" cy="104" r="50" fill="none" stroke="url(#ph-warm)"
          stroke-opacity="0.8" stroke-width="8"/>
  <circle cx="160" cy="104" r="34" fill="none" stroke="url(#ph-warm)"
          stroke-opacity="0.4" stroke-width="5"/>

  <g fill="url(#ph-warm)" fill-opacity="0.75">
    <!-- fork: three tines, a head that joins them, and a handle -->
    <rect x="65" y="44" width="6" height="28" rx="3"/>
    <rect x="77" y="44" width="6" height="28" rx="3"/>
    <rect x="89" y="44" width="6" height="28" rx="3"/>
    <rect x="65" y="66" width="30" height="16" rx="6"/>
    <rect x="76" y="80" width="8" height="76" rx="4"/>

    <!-- knife: blade tapering into a handle -->
    <path d="M238 44 c14 12 16 42 8 58 h-8 z"/>
    <rect x="238" y="98" width="8" height="58" rx="4"/>
  </g>

  <text x="160" y="204" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="16" font-weight="500" fill="#D9641F" fill-opacity="0.95">No image</text>
</svg>
