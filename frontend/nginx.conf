server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The app is client-routed: /products/<code> has no file behind it, so
    # unmatched paths fall through to index.html rather than 404ing on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the Vite dev proxy, so the frontend calls same-origin /api in
    # both environments and needs no build-time API URL.
    location /api/ {
        proxy_pass http://backend:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
