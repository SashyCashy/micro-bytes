# Render blueprint: provisions both services from this repo.
# Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: micro-bytes-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    # Render assigns $PORT; the Dockerfile binds it.
    healthCheckPath: /api/countries
    envVars:
      # Locks the public API to the static site's own origin. Render fills in
      # the host once the site below exists, so it never has to be pasted by
      # hand or updated when the URL changes.
      # `fromService … property: host` resolved to the bare service name
      # ("micro-bytes"), producing an Allow-Origin of "https://micro-bytes"
      # that no browser would ever match, so the origin is named outright.
      - key: CORS_ORIGINS
        value: https://micro-bytes.onrender.com
      # Enables POST /api/assist. `sync: false` means Render asks for the
      # value in the dashboard instead of reading it from this file, so the
      # key never lands in the repository.
      - key: OPENAI_API_KEY
        sync: false

  - type: web
    name: micro-bytes
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Order matters: the API rule has to be matched before the catch-all, or
    # every /api call would be answered with index.html.
    routes:
      # Replaces the nginx /api proxy block, which relies on a compose network
      # that does not exist here.
      # Render's placeholder is `*`, not Netlify's `:splat`, and it replaces
      # only the part the source wildcard matched. Both a `:splat` destination
      # (passed through literally) and a bare host (which dropped the /api
      # prefix) reached gunicorn with a path Flask had no route for, so every
      # API call came back as an HTML 404.
      - type: rewrite
        source: /api/*
        destination: https://micro-bytes-api.onrender.com/api/*
      # Replaces nginx try_files: client routes like /products/<code> have no
      # file behind them and would 404 on refresh.
      - type: rewrite
        source: /*
        destination: /index.html
