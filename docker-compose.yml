services:
  backend:
    build: ./backend
    # Published so the API can be exercised directly; the frontend reaches it
    # over the compose network as http://backend:5002 regardless.
    ports:
      - '5002:5002'
    environment:
      PORT: 5002
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - '8080:80'
    depends_on:
      - backend
    restart: unless-stopped
